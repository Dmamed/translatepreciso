<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Traductor Preciso · Ajustes</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; color: #1d1d1f; background: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e22; color: #ececf0; }
    input, select, textarea { background: #2b2b31; color: inherit; border-color: #555; } }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 18px; font-weight: 600; }
  small { display: block; font-weight: 400; opacity: .7; margin-top: 2px; }
  input[type=text], input[type=password], select, textarea { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
  textarea { height: 280px; font-family: ui-monospace, monospace; font-size: 13px; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { margin-top: 22px; padding: 10px 22px; font: inherit; border: 0; border-radius: 8px; background: #3b6cf6; color: #fff; cursor: pointer; }
  #status { margin-left: 12px; opacity: .8; }
</style>
</head>
<body>
  <h1>Traductor Preciso</h1>

  <label>API key de Anthropic
    <small>Se guarda solo en tu navegador. Se obtiene en console.anthropic.com.</small>
    <input type="password" id="apiKey" placeholder="sk-ant-...">
  </label>

  <label>Modelo
    <small>Sonnet: equilibrio calidad/precio. Opus: máxima precisión (más caro). Haiku: más rápido y barato.</small>
    <select id="model">
      <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (recomendado)</option>
      <option value="claude-opus-5-5">Claude Opus 5.5 (máxima precisión)</option>
      <option value="claude-haiku-5-5">Claude Haiku 5.5 (rápido y barato)</option>
    </select>
  </label>

  <div class="row">
    <div><label>Idioma principal<input type="text" id="primary"></label></div>
    <div><label>Idioma secundario<input type="text" id="secondary"></label></div>
  </div>
  <small>Si el texto está en el principal, se traduce al secundario; si no, al principal.</small>

  <label><input type="checkbox" id="notes"> Añadir "Notas del traductor" cuando un término sea ambiguo</label>

  <label>Glosario
    <small>Un término por línea, con el formato: término => traducción preferida. La IA lo seguirá al pie de la letra.</small>
    <textarea id="glossary"></textarea>
  </label>

  <button id="save">Guardar</button><span id="status"></span>

  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
